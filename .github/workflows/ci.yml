name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy apps packages
      - run: pytest -m 'not integration' -W error
      - run: python -m compileall -q apps packages tests
      - run: alembic -c infrastructure/postgres/api/alembic.ini heads
      - run: alembic -c infrastructure/postgres/engine/alembic.ini heads
      - run: alembic -c infrastructure/postgres/worker/alembic.ini heads

  integration:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/run-integration.sh
